services:
  postgres:
    image: postgres:16-alpine
    container_name: affiliate-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: johndoe
      POSTGRES_PASSWORD: randompassword
      POSTGRES_DB: affiliate_manager
    ports:
      - "5432:5432"
    volumes:
      - affiliate_manager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U johndoe -d affiliate_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: affiliate-manager-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - affiliate_manager_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  affiliate_manager_postgres_data:
  affiliate_manager_redis_data:
